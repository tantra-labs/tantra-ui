[package]
name = "tantra-ui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Presentational UI atoms, molecules, screener primitives, and home primitives for the Tantra workstation"

[lib]
name = "tantra_ui_core"

[dependencies]
tantra-core.workspace = true
# Chart geometry primitives for the EE+ Strategy Studio view-model helpers
# (`studio_ee_lines`/`studio_ee_bands`/`studio_ee_marks`/`studio_ee_stops`
# return `tantra_ui_charts` types shared by the web/TUI/CLI surfaces, plan 0006
# Phases 2–4). `tantra-ui-charts` is WASM-clean (zero-I/O) so this keeps
# `tantra-ui-core` wasm32-unknown-unknown-portable.
tantra-ui-charts.workspace = true
serde.workspace = true
thiserror.workspace = true
rust_decimal.workspace = true
chrono.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
