[workspace]
resolver = "2"
members = [
  "crates/tantra-ui",
  "crates/tantra-ui-app",
  "crates/tantra-ui-core",
  "crates/tantra-ui-client",
  "crates/tantra-ui-api-wasm",
  "crates/tantra-ui-assets",
  "crates/tantra-ui-charts",
  "crates/tantra-cli",
  "crates/tantra-tui",
  "crates/tantra-highlight",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
repository = "https://github.com/tantra-labs/tantra-ui"

[workspace.dependencies]
# Tantra internal crates
tantra-core = { path = "../tantra-core" }
# Facade of this workspace (repo-named convention, root plan 0003 Phase 4).
tantra-ui = { path = "crates/tantra-ui" }
# Agent-chat wiring (from upstream) kept for CLI/TUI integration with the
# tantra-agent workspace.
tantra-agent-core = { path = "../tantra-agent/crates/tantra-agent-core" }
tantra-agent-chat = { path = "../tantra-agent/crates/tantra-agent-chat" }
tantra-agent-chat-tools = { path = "../tantra-agent/crates/tantra-agent-chat-tools" }
tantra-agent-llm = { path = "../tantra-agent/crates/tantra-agent-llm" }
tantra-agent-prompt = { path = "../tantra-agent/crates/tantra-agent-prompt" }
# Runtime jobs/journal wiring for the CLI (`tantra jobs *` — PLAN-0001 Stage 4).
# Native binaries only: these crates pull tokio/sqlx and must never leak into
# the WASM modules (see migration-guide.md §2).
tantra-runtime-jobs = { path = "../tantra-runtime/crates/tantra-runtime-jobs" }
tantra-runtime-api = { path = "../tantra-runtime/crates/tantra-runtime-api" }
tantra-runtime-api-rest = { path = "../tantra-runtime/crates/tantra-runtime-api-rest" }
tantra-ui-core = { path = "crates/tantra-ui-core" }
tantra-ui-assets = { path = "crates/tantra-ui-assets" }
tantra-ui-charts = { path = "crates/tantra-ui-charts" }
tantra-ui-client = { path = "crates/tantra-ui-client" }
tantra-ui-api-wasm = { path = "crates/tantra-ui-api-wasm" }
tantra-ui-app = { path = "crates/tantra-ui-app" }
tantra-highlight = { path = "crates/tantra-highlight" }
tantra-tui = { path = "crates/tantra-tui" }
tantra-cli = { path = "crates/tantra-cli" }

# External dependencies
#
# WASM-portability contract (migration-guide.md §2): the WASM crates
# (`tantra-ui-core`, `tantra-ui-assets`, `tantra-ui-client`,
# `tantra-ui-charts`, `tantra-ui-api-wasm`, `tantra-ui-app`) must NEVER
# depend on `tokio`, `ratatui`, or `crossterm`. Async/native runtime deps are
# isolated to `tantra-tui` and `tantra-cli`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# `uuid` is pulled transitively from `tantra-core` (v4/v5/serde). The
# `rng-getrandom` feature makes it compile on `wasm32-unknown-unknown`,
# which the WASM workstation requires (migration-guide.md §2).
uuid = { version = "1", features = ["v4", "v5", "v7", "serde", "rng-getrandom"] }
rust_decimal = "1"
schemars = { version = "0.8", features = ["derive", "chrono", "uuid1", "rust_decimal"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
futures = "0.3"
toml = "0.8"
# getrandom needs the `wasm_js` feature for wasm32-unknown-unknown; the
# feature is enabled from the WASM crates that must compile to that target.
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.dev]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.test]
opt-level = 1
debug = false
strip = "debuginfo"

[profile.dbg]
inherits = "dev"
debug = 2
strip = "none"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.prod]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
